<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Enterprise Network SIEM Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
  (function () {
    var STORAGE_KEY = 'siem.theme';
    var VALID = ['gunmetal', 'daylight', 'phosphor', 'high-contrast'];
    try {
      var stored = localStorage.getItem(STORAGE_KEY);
      if (VALID.indexOf(stored) !== -1) {
        document.documentElement.dataset.theme = stored;
      }
    } catch (e) {
      // Storage blocked or unavailable: the :root block (gunmetal) applies.
    }
  })();
</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <script>
  if (typeof global === 'undefined') {
    var global = window;
  }
</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
