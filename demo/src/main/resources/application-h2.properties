# Izole, bellek ici H2 profili: yerel calistirma ve otomatik testler icin.
# Hicbir dis servise baglanmaz, surec bitince veri kaybolur.
spring.datasource.url=jdbc:h2:mem:siemconsole;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bu ornek her calistirmada sifirdan kuruldugu icin sema entity'lerden uretilir.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway migration'lari PostgreSQL soz dizimine gore yazilmistir, H2'de calistirilmaz.
spring.flyway.enabled=false

# Zamanlayici kilidi tablosu bir JPA entity'si degildir, bu yuzden ddl-auto onu
# uretmez ve bu profilde Flyway kapalidir. Ayni tanim H2 soz dizimiyle burada
# kurulur; script Hibernate'in sema uretiminden once calisir.
spring.sql.init.mode=embedded
spring.sql.init.schema-locations=classpath:db/h2/shedlock-schema.sql

# Bu profil yerel calistirma ve otomatik testler icindir; gercek bir ortama
# hicbir zaman baglanmaz, bu yuzden imzalama sirri burada sabit ve testler
# ortam degiskeni gerektirmeden calisir. JwtService HS256 icin en az 32 bayt
# istiyor.
siem.jwt.secret=h2-profile-only-fixed-test-signing-secret-never-used-outside-tests

# Yerel gelistirme: Angular dev server'in olasi portlari + docker-compose
# frontend container'inin yayinladigi port.
siem.cors.allowed-origins=http://localhost:4200,http://localhost:4277,http://localhost:80

# Bu profil yerel calistirma ve otomatik testler icindir; dashboard'un bos
# gorunmemesi icin demo cihazlari her sifirdan kurulan calistirmada tohumlanir.
siem.seed.enabled=true
