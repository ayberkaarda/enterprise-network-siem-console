# PostgreSQL profili - docker compose'daki siem-db servisine baglanir.
# Kimlik bilgileri ortam degiskeninden gelir; gercek degerler .env dosyasinda tutulur (bkz. .env.example).
spring.datasource.url=jdbc:postgresql://siem-db:5432/siem_console
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:siem_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Sema yalnizca Flyway migration'lari ile degisir; Hibernate sadece dogrular.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

# JWT imzalama sirri: kaynakta hicbir varsayilani yok (bkz. JwtService), bu
# yuzden ortam degiskeni eksikse uygulama acilmaz. docker-compose zaten
# JWT_SECRET'i zorunlu kilar (bkz. docker-compose.yml, .env.example).
siem.jwt.secret=${JWT_SECRET}

# Ilk operator hesabinin parolasi. AdminUserBootstrap kendi icinde
# "changeme-on-first-login" varsayilanini zaten tasidigi icin burada da ayni
# varsayilan tekrarlanir; ortam degiskeni yalnizca gercek bir deger
# sagliyorsa devreye girer.
siem.bootstrap.admin-password=${SIEM_ADMIN_PASSWORD:changeme-on-first-login}

# docker-compose'daki frontend container'i host'un 80 portunda yayinlanir.
# Tarayici, hedef port varsayilan HTTP portuysa (80) Origin basligina port
# eklemez; ikisi de listelenir ki tarayicinin gonderdigi gercek deger de
# kapsansin.
siem.cors.allowed-origins=http://localhost,http://localhost:80
