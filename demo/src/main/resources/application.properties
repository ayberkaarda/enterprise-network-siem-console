# Profilden bagimsiz ayarlar.
# Veri kaynagi ve sema yonetimi profile ozeldir:
#   application-postgres.properties  -> PostgreSQL + Flyway (docker compose / calisan ortam)
#   application-h2.properties        -> izole, bellek ici H2 (yerel calistirma ve testler)
# Aktif profil SPRING_PROFILES_ACTIVE ortam degiskeni ile secilir.

# Web sunucusunun calisacagi port
server.port=8080

# Istek isleme, @Async gorevleri ve zamanlayici sanal thread uzerinde calisir.
# Ag taramasi cihaz basina blokeleyen bir I/O cagrisidir; sanal thread'lerde
# blokede gecen sure bir platform thread'ini tutmaz, bu yuzden tarama suresi
# cihaz sayisiyla dogru orantili buyumez.
spring.threads.virtual.enabled=true

# Izleme ve Metrik Ayarlari
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Olay alim uc noktasinin (POST /api/v1/events) istemci basina hiz siniri.
# Token bucket: her dolum periyodunda "capacity" kadar istek hakki yeniden
# doldurulur. Degerler her iki profilde de ortaktir, profile ozel bir ayrim
# gerekmiyor.
siem.ratelimit.events.path=/api/v1/events
siem.ratelimit.events.capacity=20
siem.ratelimit.events.refill-period=PT1S
siem.ratelimit.events.idle-retention=PT10M

# Bir kerelik demo cihaz tohumlama (DataSeeder). Varsayilan kapali: gercek bir
# dagitimin sessizce sahte cihazlarla dolmasini onlemek icin. h2 profili
# yerel/dev calistirma icin bunu acar; postgres profilinde bu satir override
# edilmez, yani prod'da kapali kalir.
siem.seed.enabled=false

# Latency ornegi (latency_sample) saklama suresi. Arka plan taramasi her cihaz
# icin ~30 saniyede bir satir yazar ve bu satirlar hicbir purge olmadan
# sinirsiz birikir; DeviceService gunde bir kez bu tarihten eski satirlari
# siler. ISO-8601 Duration, siem.ratelimit.* ile ayni konvansiyon. Deger her
# iki profilde de ortaktir, profile ozel bir ayrim gerekmiyor.
siem.latency.retention=P30D
